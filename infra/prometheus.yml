global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: taskorbit-backend
    static_configs:
      - targets:
          - backend:8000
    metrics_path: /metrics

  - job_name: taskorbit-worker
    static_configs:
      - targets:
          - worker:8001
    metrics_path: /metrics
