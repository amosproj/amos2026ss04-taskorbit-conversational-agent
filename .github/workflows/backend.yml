# Backend CI for the TaskOrbit Conversational Agent.
#
# Split into separate jobs so the Actions UI shows each stage (install,
# lint, format, tests) as its own block. Jobs chain with `needs`; each job
# bootstraps via `.github/actions/backend-bootstrap` and restores the same
# Poetry cache so installs stay fast after the first warm-up.
#
# Local equivalents (run from `backend/`):
#   poetry install --with dev
#   poetry run ruff check .
#   poetry run ruff format --check .
#   poetry run pytest
#
# See Documentation/ci-cd.md for the full team-facing guide.

name: Backend CI

on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - ".github/actions/backend-bootstrap/**"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - ".github/actions/backend-bootstrap/**"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "1.8.4"

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1 — prove the lockfile resolves and the venv is buildable.
  # ---------------------------------------------------------------------------
  backend-install:
    name: "Backend — 1. Install"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bootstrap backend environment
        uses: ./.github/actions/backend-bootstrap
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: Verify Poetry environment
        working-directory: backend
        run: poetry run python -c "import taskorbit; print('taskorbit import OK')"

  # ---------------------------------------------------------------------------
  # Stage 2 — lint (must pass before format/tests run).
  # ---------------------------------------------------------------------------
  backend-lint:
    name: "Backend — 2. Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend-install
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bootstrap backend environment
        uses: ./.github/actions/backend-bootstrap
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: Lint with ruff
        working-directory: backend
        run: poetry run ruff check .

  # ---------------------------------------------------------------------------
  # Stage 3 — formatting check (non-mutating).
  # ---------------------------------------------------------------------------
  backend-format:
    name: "Backend — 3. Format"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bootstrap backend environment
        uses: ./.github/actions/backend-bootstrap
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: Check formatting with ruff
        working-directory: backend
        run: poetry run ruff format --check .

  # ---------------------------------------------------------------------------
  # Stage 4 — unit tests.
  # ---------------------------------------------------------------------------
  backend-test:
    name: "Backend — 4. Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend-format
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bootstrap backend environment
        uses: ./.github/actions/backend-bootstrap
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: Run unit tests with pytest
        working-directory: backend
        run: poetry run pytest
