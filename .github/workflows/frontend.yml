# Frontend CI for the TaskOrbit Conversational Agent.
#
# Split into separate jobs so the Actions UI shows install, lint, and
# format as distinct stages. Jobs chain with `needs`; each job uses
# `.github/actions/frontend-bootstrap` so `npm ci` stays fast via the
# setup-node npm cache after the first warm-up.
#
# Frontend tests are intentionally NOT executed because the project has no
# test suite yet.
#
# Local equivalents (run from `frontend/`):
#   npm ci
#   npm run lint
#   npm run format:check

name: Frontend CI

on:
  push:
    branches: ["**"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
      - ".github/actions/frontend-bootstrap/**"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
      - ".github/actions/frontend-bootstrap/**"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1 — deterministic install from lockfile.
  # ---------------------------------------------------------------------------
  frontend-install:
    name: "Frontend — 1. Install"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bootstrap frontend environment
        uses: ./.github/actions/frontend-bootstrap
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify Node toolchain
        working-directory: frontend
        run: node --version && npm --version

  # ---------------------------------------------------------------------------
  # Stage 2 — ESLint (errors fail; warnings are advisory).
  # ---------------------------------------------------------------------------
  frontend-lint:
    name: "Frontend — 2. Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: frontend-install
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bootstrap frontend environment
        uses: ./.github/actions/frontend-bootstrap
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint with ESLint
        working-directory: frontend
        run: npm run lint

  # ---------------------------------------------------------------------------
  # Stage 3 — Prettier check (non-mutating).
  # ---------------------------------------------------------------------------
  frontend-format:
    name: "Frontend — 3. Format"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: frontend-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bootstrap frontend environment
        uses: ./.github/actions/frontend-bootstrap
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check formatting with Prettier
        working-directory: frontend
        run: npm run format:check
