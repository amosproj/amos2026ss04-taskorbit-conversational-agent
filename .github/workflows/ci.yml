# Unified CI pipeline for the TaskOrbit Conversational Agent.
#
# Runs on every push and pull request. The pipeline is split into named
# jobs that chain with `needs` so the Actions UI shows each stage as its
# own block:
#
#   Backend  — 1. Install -> 2. Lint -> 3. Format -> 4. Tests
#                                                    |
#                                                    v
#   Frontend — 1. Install -> 2. Lint -> 3. Format
#
# Frontend jobs only start once the backend job chain has fully passed,
# matching the "test the backend, then the frontend" flow requested by
# the team. Each job uses one of the shared composite actions in
# `.github/actions/{backend,frontend}-bootstrap` so the bootstrap logic
# (toolchain install, cache restore, dependency install) is defined once.
#
# Local equivalents:
#   Backend (run from `backend/`):
#     poetry install --with dev
#     poetry run ruff check .
#     poetry run ruff format --check .
#     poetry run pytest
#   Frontend (run from `frontend/`):
#     npm ci
#     npm run lint
#     npm run format:check
#
# See Documentation/ci-cd.md for the full team-facing guide.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Allow manual re-runs from the Actions tab without a code push.
  workflow_dispatch:

# Cancel any in-flight run on the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token. The job only needs to read the source tree.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "1.8.4"
  NODE_VERSION: "20"

jobs:
  # ===========================================================================
  # BACKEND PIPELINE — 4 stages, each in its own job.
  # ===========================================================================

  # Stage 1 — prove the lockfile resolves and the venv is buildable.
  backend-install:
    name: "Backend — 1. Install"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bootstrap backend environment
        uses: ./.github/actions/backend-bootstrap
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: Verify Poetry environment
        working-directory: backend
        run: poetry run python -c "import taskorbit; print('taskorbit import OK')"

  # Stage 2 — lint (must pass before format/tests run).
  backend-lint:
    name: "Backend — 2. Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend-install
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bootstrap backend environment
        uses: ./.github/actions/backend-bootstrap
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: Lint with ruff
        working-directory: backend
        run: poetry run ruff check .

  # Stage 3 — formatting check (non-mutating).
  backend-format:
    name: "Backend — 3. Format"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bootstrap backend environment
        uses: ./.github/actions/backend-bootstrap
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: Check formatting with ruff
        working-directory: backend
        run: poetry run ruff format --check .

  # Stage 4 — unit tests.
  backend-test:
    name: "Backend — 4. Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend-format
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bootstrap backend environment
        uses: ./.github/actions/backend-bootstrap
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: Run unit tests with pytest
        working-directory: backend
        run: poetry run pytest

  # ===========================================================================
  # FRONTEND PIPELINE — starts once the backend pipeline is fully green.
  # ===========================================================================

  # Stage 1 — deterministic install from lockfile.
  frontend-install:
    name: "Frontend — 1. Install"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: backend-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bootstrap frontend environment
        uses: ./.github/actions/frontend-bootstrap
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify Node toolchain
        working-directory: frontend
        run: node --version && npm --version

  # Stage 2 — ESLint (errors fail; warnings are advisory).
  frontend-lint:
    name: "Frontend — 2. Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: frontend-install
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bootstrap frontend environment
        uses: ./.github/actions/frontend-bootstrap
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint with ESLint
        working-directory: frontend
        run: npm run lint

  # Stage 3 — Prettier check (non-mutating).
  frontend-format:
    name: "Frontend — 3. Format"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: frontend-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bootstrap frontend environment
        uses: ./.github/actions/frontend-bootstrap
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check formatting with Prettier
        working-directory: frontend
        run: npm run format:check
