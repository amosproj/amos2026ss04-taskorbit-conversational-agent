# Shared bootstrap for frontend CI jobs.
#
# Each job runs on a fresh runner; npm cache from setup-node speeds up
# repeated `npm ci` across chained jobs.
name: Frontend bootstrap
description: Set up Node, npm cache, and install frontend dependencies

inputs:
  node-version:
    description: Node.js version
    required: true

runs:
  using: composite
  steps:
    - name: Set up Node ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies (npm ci)
      shell: bash
      working-directory: frontend
      run: npm ci
