# Component benchmark — compare STT/LLM/TTS pipeline combinations (#68)
#
# Requirements:
#   Running backend at BENCHMARK_API_URL (default http://localhost:8000)
#   BENCHMARK_API_TOKEN set for authenticated /v1/conversations/process calls when auth enabled
#   OLLAMA_BASE_URL + OLLAMA_MODEL on backend for the OSS config
#
# Run:
#   python runner/run_component_benchmark.py --config configs/component-benchmark.yaml
#   python runner/run_component_benchmark.py --config configs/component-benchmark.yaml --dry-run

name: component-benchmark
description: "Compare cloud OpenAI vs self-hosted Ollama across #68 prompt categories (text + voice paths)"

prompt_set: benchmarks/prompts/component_prompts.json

repetitions: 5
concurrency: 1
timeout_seconds: 180

paths:
  - text
  - voice

configs:
  - name: cloud-openai-deepgram-elevenlabs
    stt_provider: deepgram
    stt_model: nova-3
    llm_provider: openai
    llm_model: gpt-4o-mini
    tts_provider: elevenlabs
    tts_voice_id: CwhRBWXzGAHq8TQ4Fs17
    tts_model: eleven_multilingual_v2

  - name: oss-ollama-deepgram-deepgram
    stt_provider: deepgram
    stt_model: nova-2
    llm_provider: ollama
    llm_model: gemma4:26b
    tts_provider: deepgram
    tts_voice_id: aura-2-andromeda-en
    tts_model: aura-2-andromeda-en

tags:
  ticket: "68"
  version: v2-text-voice-ollama
