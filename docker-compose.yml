# Brings up postgres, backend (FastAPI), and frontend (Vite) for local development.
# Voice uses LiveKit Cloud Agents — set LIVEKIT_AGENT_DISPATCH_NAME or
# LIVEKIT_AGENT_NAME in backend/.env. Source code is bind-mounted so hot reload
# works on both backend and frontend.
#
# Usage:
#   cp backend/.env.example backend/.env             # then fill in keys
#   cp frontend/.env.example frontend/.env.local
#   docker compose up --build
#
# Services:
#   postgres  → :5435 (host) → :5432 in container; avoids clashing with a local Postgres on 5432.
#   backend   → :8000  FastAPI HTTP API (token issuance, REST fallback)
#   worker    → :8001  LiveKit voice agent (STT → orchestrator → TTS); /metrics for Prometheus
#   frontend  → :5173  Vite dev server with HMR

services:
  postgres:
    image: postgres:16-alpine
    container_name: taskorbit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskorbit
      POSTGRES_PASSWORD: taskorbit
      POSTGRES_DB: taskorbit
    ports:
      - "5435:5432"
    volumes:
      - taskorbit-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskorbit -d taskorbit"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: taskorbit-backend
    env_file:
      - ./backend/.env
    environment:
      # Override the host so the container talks to the postgres service
      # by its compose name, not localhost.
      DATABASE_URL: postgresql://taskorbit:taskorbit@postgres:5432/taskorbit
      PYTHONUNBUFFERED: "1"
      # Ensure Python can find the 'taskorbit' module inside the /app/src directory
      PYTHONPATH: /app/src
      # Force JSON logs so Promtail/Loki can parse them even in dev mode.
      LOG_JSON: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./backend/migrations:/app/migrations
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/start.sh:/app/start.sh
    command: bash start.sh
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: taskorbit-worker
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://taskorbit:taskorbit@postgres:5432/taskorbit
      PYTHONUNBUFFERED: "1"
      LOG_JSON: "true"
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
    ports:
      - "8001:8001"
    volumes:
      - ./backend/src:/app/src
      - taskorbit-worker-prometheus:/tmp/prometheus_multiproc
    command: poetry run taskorbit-worker dev
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: taskorbit-frontend
    env_file:
      - ./frontend/.env.local
    environment:
      VITE_API_URL: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      backend:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: taskorbit-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - taskorbit-prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - backend
      - worker

  loki:
    image: grafana/loki:3.2.0
    container_name: taskorbit-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:3.2.0
    container_name: taskorbit-promtail
    restart: unless-stopped
    volumes:
      - ./infra/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.3.0
    container_name: taskorbit-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # WARNING: anonymous Grafana admin — local dev only, NOT for production.
      # Remove or restrict GF_AUTH_ANONYMOUS_* before deploying to any shared environment.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      PROMETHEUS_URL: "http://prometheus:9090"
      LOKI_URL: "http://loki:3100"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - taskorbit-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  taskorbit-postgres-data:
  taskorbit-prometheus-data:
  taskorbit-grafana-data:
  taskorbit-worker-prometheus:
